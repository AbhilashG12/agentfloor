[package]
name = "collector-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
agentfloor-core = { path = "../agentfloor-core" }
tokio = { version = "1", features = ["full"] }
notify = "6.1.1"          # For file watching
reqwest = { version = "0.11", features = ["json"] } # HTTP client
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
